[build]
  command = "pnpm --filter @yvml/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "11.1.1"

# Production (main) is staging.yvml.org. Everything else is non-production.
[context.production.environment]
  NEXT_PUBLIC_ENVIRONMENT = "production"

[context.deploy-preview.environment]
  NEXT_PUBLIC_ENVIRONMENT = "preview"

[context.branch-deploy.environment]
  NEXT_PUBLIC_ENVIRONMENT = "preview"

# The long-lived `preview` branch is preview.yvml.org: the same site, showing Sanity drafts, behind a Clerk login
# (apps/web/src/middleware.preview.ts, built only when PREVIEW_SITE=true). Also set for this branch only:
# NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY, PREVIEW_ALLOWED_EMAILS (comma separated emails or @domain),
# PREVIEW_COOKIE_SECRET (32+ random characters). Set
# SANITY_API_READ_TOKEN (Viewer role) for this branch in the Netlify UI; it stays server-side. Never set
# PREVIEW_SITE in the production context.
[context.preview.environment]
  NEXT_PUBLIC_ENVIRONMENT = "preview"
  PREVIEW_SITE = "true"

# Not public yet: noindex everywhere (production = staging.yvml.org, plus preview and branch deploys), and the edge
# function in netlify/edge-functions/block-bots.ts turns away crawlers. Remove both when the site goes live.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# English has no prefix: `/en/...` is the same page as `/...`, so it redirects there and a page has one address. Next
# cannot do this itself (its i18n redirects see the unprefixed English address as `/en/...` too and loop).
[[redirects]]
  from = "/en"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 301
  force = true

[dev]
  command = "pnpm --filter @yvml/web dev"
  framework = "#custom"
  targetPort = 3000
  port = 8888

[[plugins]]
  package = "@netlify/plugin-nextjs"
